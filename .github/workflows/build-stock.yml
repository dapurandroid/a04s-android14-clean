name: Build KernelSU-Next A14 (Final Weapon)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential curl flex git \
            libelf-dev libssl-dev lz4 python3 zip unzip wget cpio

      - name: Prepare Workspace & Download Assets
        run: |
          mkdir -p $GITHUB_WORKSPACE/workspace
          cd $GITHUB_WORKSPACE/workspace
          
          echo "-> Mengunduh Pure Stock Kernel A14..."
          wget -q https://github.com/dapurandroid/a04s-android14-clean/releases/download/v1.0/stock_kernel.tar.gz
          
          echo "-> Mengekstrak Kernel secara Native Linux..."
          mkdir -p kernel_src
          tar -xzf stock_kernel.tar.gz -C kernel_src
          
          echo "-> Membajak Toolchain Lawas..."
          git clone --depth=1 https://github.com/dapurandroid/android_kernel_a047f_eur forked_repo
          mv forked_repo/toolchain ./toolchain
          rm -rf forked_repo

      - name: Membantai Vermagic & Bypass Keamanan Samsung (Taktik Ravindu)
        run: |
          cd $GITHUB_WORKSPACE/workspace
          KERNEL_ROOT=$(find $(pwd)/kernel_src -name "Makefile" -exec grep -l "^VERSION =" {} \; | head -n 1 | xargs dirname)
          cd "$KERNEL_ROOT"
          
          echo "-> Mencegah Compiler menambahkan string -dirty pada nama kernel..."
          # Pastikan file lama bisa ditulis/dihapus dulu
          chmod +w scripts/setlocalversion || true
          
          # Tulis ulang file setlocalversion agar bersih dari vermagic kotor
          cat << 'EOF' > scripts/setlocalversion
          #!/bin/sh
          echo ""
          EOF
          
          # BERIKAN IZIN EKSEKUSI (KUNCI UTAMA AGAR TIDAK PERMISSION DENIED)
          chmod +x scripts/setlocalversion
          
          echo "-> Menyamarkan /proc/config.gz (Bypass Userspace Samsung)..."
          DEFCONFIG="arch/arm64/configs/exynos850-a04sxx_defconfig"
          chmod +w $DEFCONFIG || true
          sed -i 's/CONFIG_IKCONFIG=y/# CONFIG_IKCONFIG is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_IKCONFIG_PROC=y/# CONFIG_IKCONFIG_PROC is not set/g' $DEFCONFIG
          
          echo "✅ Jebakan Vermagic dan config.gz berhasil dilumpuhkan!"

      - name: Inject KernelSU-Next & Disable Knox
        run: |
          cd $GITHUB_WORKSPACE/workspace
          KERNEL_ROOT=$(find $(pwd)/kernel_src -name "Makefile" -exec grep -l "^VERSION =" {} \; | head -n 1 | xargs dirname)
          cd "$KERNEL_ROOT"
          
          echo "-> Menyuntikkan KernelSU-Next (Latest)..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          echo "-> Melumpuhkan Satpam Samsung (Knox, PROCA, DEFEX)..."
          DEFCONFIG="arch/arm64/configs/exynos850-a04sxx_defconfig"
          
          sed -i 's/CONFIG_PROCA=y/# CONFIG_PROCA is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_DEFEX=y/# CONFIG_DEFEX is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_KNOX_KAP=y/# CONFIG_KNOX_KAP is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_SEC_RESTRICT=y/# CONFIG_SEC_RESTRICT is not set/g' $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          
          echo "-> Patch Kompatibilitas KSU & Surgical Stubbing API Modern..."
          KSU_DIR="drivers/kernelsu"
          if [ -d "$KSU_DIR" ]; then
            # 1. Fix Header & Makro Dasar
            for f in $(find -L "$KSU_DIR" -type f -name "sucompat.c" 2>/dev/null); do sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g' "$f"; done
            for f in $(find -L "$KSU_DIR" -type f -name "su_mount_ns.c" 2>/dev/null); do sed -i 's|<uapi/linux/mount.h>|<linux/mount.h>|g' "$f"; done
            for f in $(find -L "$KSU_DIR" -type f -name "seccomp_cache.c" 2>/dev/null); do sed -i '1i #ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 1024\n#endif' "$f"; done
            for f in $(find -L "$KSU_DIR" -type f -name "app_profile.c" 2>/dev/null); do sed -i '/filter_count/d' "$f"; done
            find -L "$KSU_DIR" -type f -name "*.c" -exec sed -i '1i #ifndef TWA_RESUME\n#define TWA_RESUME true\n#endif\n#ifndef fallthrough\n#define fallthrough do { } while(0)\n#endif\n#include <linux/sched/task.h>' {} \;
            find -L "$KSU_DIR" -type f -name "*.[ch]" -exec sed -i 's|<linux/minmax.h>|<linux/kernel.h>|g' {} \;
            
            # 2. Fix Fungsi Nofault
            find -L "$KSU_DIR" -type f -name "*.c" -exec sed -i 's/strncpy_from_user_nofault/strncpy_from_user/g' {} \;
            find -L "$KSU_DIR" -type f -name "*.c" -exec sed -i 's/copy_from_user_nofault/probe_kernel_read/g' {} \;
            find -L "$KSU_DIR" -type f -name "*.c" -exec sed -i 's/copy_to_user_nofault/copy_to_user/g' {} \;
            find -L "$KSU_DIR" -type f -name "*.c" -exec sed -i 's/copy_to_kernel_nofault/probe_kernel_write/g' {} \;
            
            # 3. Fix Tasklist Lock
            for f in $(find -L "$KSU_DIR" -type f -name "dispatch.c" 2>/dev/null); do
              sed -i '1i #include <linux/spinlock.h>\n#include <linux/sched/signal.h>\nextern struct task_struct init_task;\nextern rwlock_t tasklist_lock;' "$f"
            done
            
            # 4. SURGICAL STUBBING (SOLUSI PINTAR ANTISIPASI ERROR)
            echo "-> Menetralkan VFS Wrapper & SELinux Modern..."
            WRAPPER_C=$(find -L "$KSU_DIR" -type f -name "file_wrapper.c" | head -n 1)
            if [ -n "$WRAPPER_C" ]; then
              cat << 'EOF' > "$WRAPPER_C"
          #include <linux/fs.h>
          #include <linux/types.h>
          int ksu_file_wrapper_init(void) { return 0; }
          void ksu_file_wrapper_exit(void) {}
          int ksu_install_file_wrapper(struct file *file) { return 0; }
          EOF
            fi

            OBSERVER_C=$(find -L "$KSU_DIR" -type f -name "pkg_observer.c" | head -n 1)
            if [ -n "$OBSERVER_C" ]; then
              cat << 'EOF' > "$OBSERVER_C"
          #include <linux/types.h>
          int ksu_observer_init(void) { return 0; }
          void ksu_observer_exit(void) {}
          EOF
            fi
            
            echo "int apply_kernelsu_rules(void) { return 0; }" > "$KSU_DIR/selinux/rules.c"
            
            cat << 'EOF' > "$KSU_DIR/selinux/sepolicy.c"
          int handle_sepolicy(unsigned long arg3, void *arg4) { return 0; }
          EOF
            
            echo "int dummy_selinux_hide = 0;" > "$KSU_DIR/feature/selinux_hide.c"

            # 5. FIX KOMPATIBILITAS SELINUX CRED UNTUK COMPILER LAWAS (HAJAR DI HULU)
            echo "-> Memperbaiki deklarasi selinux_cred di selinux.c..."
            SELINUX_C="drivers/kernelsu/selinux/selinux.c"
            if [ -f "$SELINUX_C" ]; then
              sed -i '1i #ifndef selinux_cred\n#define selinux_cred(c) ((c) ? (c)->security : NULL)\n#endif' "$SELINUX_C"
            fi
            
            # 6. Suntik Karpet Merah KSU ke SELinux Samsung (AVC Bypass + C90 Fix)
            AVC_C="security/selinux/avc.c"
            if [ -f "$AVC_C" ]; then
              sed -i '1i #pragma GCC diagnostic ignored "-Wdeclaration-after-statement"' "$AVC_C"
              awk '
              BEGIN { decl=0 }
              /^int avc_has_perm\(/ || /^int avc_has_perm_noaudit\(/ {
                  if (decl == 0) {
                      print "extern bool is_ksu_domain(void) __attribute__((weak));"
                      decl = 1
                  }
                  in_func = 1
              }
              in_func && /^{/ {
                  print $0
                  print "    if (is_ksu_domain && is_ksu_domain()) return 0; /* KSU VIP Bypass */"
                  in_func = 0
                  next
              }
              1' "$AVC_C" > temp_avc.c && mv temp_avc.c "$AVC_C"
            fi
            
            # 7. Penawar Linker Final (The Ultimate Linker Fix)
            INIT_C=$(find -L "$KSU_DIR" -type f -name "init.c" | head -n 1)
            if [ -n "$INIT_C" ]; then
              cat << 'EOF' >> "$INIT_C"
          /* KSU 4.19 COMPATIBILITY STUBS FOR LINKER */
          #include <linux/fs.h>
          
          __attribute__((weak)) void ksu_selinux_hide_init(void) {}
          __attribute__((weak)) void ksu_selinux_hide_exit(void) {}
          __attribute__((weak)) void ksu_selinux_hide_handle_post_fs_data(void) {}
          __attribute__((weak)) void ksu_selinux_hide_handle_second_stage(void) {}
          __attribute__((weak)) void ksu_selinux_hide_drop_backup_if_unused(void) {}
          __attribute__((weak)) void* selinux_cred(const struct cred *c) { return c ? c->security : NULL; }
          
          /* OBAT LINKER TERBARU (MOUNT & SECCOMP) */
          __attribute__((weak)) int path_mount(const char *dev_name, struct path *path, const char *type_page, unsigned long flags, void *data_page) { return 0; }
          __attribute__((weak)) int path_umount(struct path *path, int flags) { return 0; }
          __attribute__((weak)) void seccomp_filter_release(void *tsk) {}
          EOF
            fi
          fi
          
      - name: Compile Kernel & Inject KSU (Perbaikan Final)
      run: |
        cd workspace/kernel_src
        
        # 1. Deklarasi Variabel Android (Mutlak untuk Android Kernel)
        # Sesuai taktik Ravindu, namun kita sesuaikan untuk Android 14 (U)
        export PLATFORM_VERSION=14
        export ANDROID_MAJOR_VERSION=u
        
        # 2. Kembalikan Injeksi KernelSU-Next via Curl (Bukan Submodule)
        echo "-> Menyuntikkan KernelSU-Next..."
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
        
        # 3. Modifikasi Makefile Inti ala Ravindu
        # Menambahkan LINUXINCLUDE KSU ke Makefile utama persis seperti struktur Ravindu
        echo "-> Menambahkan KSU Include ke Makefile..."
        sed -i 's/$(USERINCLUDE)/$(USERINCLUDE)\n\n# KSU\nLINUXINCLUDE\t+= -I$(srctree)\/drivers\/kernelsu\/include/g' Makefile
        
        # 4. Buat version.config persis seperti build.sh Ravindu
        echo -e "CONFIG_LOCALVERSION_AUTO=n\nCONFIG_LOCALVERSION=\"-dev\"\n" > "arch/arm64/configs/version.config"
        
        # 5. Eksekusi Kompilasi (TANPA a04s.config karena sampean pakai stock bersih)
        export COMPILER_ARGS="-C $(pwd) O=$(pwd)/out -j$(nproc) ARCH=arm64 CROSS_COMPILE=${GITHUB_WORKSPACE}/workspace/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android- CC=${GITHUB_WORKSPACE}/workspace/toolchain/clang/host/linux-x86/clang-r353983c/bin/clang"
        
        echo "-> Memulai Kompilasi Inti..."
        make $COMPILER_ARGS exynos850-a04sxx_defconfig version.config
        make $COMPILER_ARGS

      - name: Setup AIK-Linux & Package Odin Tar
        run: |
          cd $GITHUB_WORKSPACE
          
          echo "-> Membersihkan area kerja..."
          rm -rf AIK aik.tar.gz stock_boot.zip
          
          echo "-> Mengunduh AIK-Linux dari Release Internal..."
          wget -q https://github.com/dapurandroid/a04s-android14-clean/releases/download/v1.0-boot/AIK-Linux-v3.8-ALL.tar.gz -O aik.tar.gz || { echo "::error::Gagal mengunduh AIK!"; exit 1; }
          
          echo "-> Mengekstrak AIK-Linux..."
          mkdir AIK
          tar -xzf aik.tar.gz -C AIK --strip-components=1
          cd AIK
          
          echo "-> Mengunduh Stock Boot.img dari Release Internal..."
          wget -q https://github.com/dapurandroid/a04s-android14-clean/releases/download/v1.0-boot/stock_boot.zip -O stock_boot.zip || { echo "::error::Gagal mengunduh stock boot.img dari Release!"; exit 1; }
          unzip -q stock_boot.zip
          
          if [ ! -f "boot.img" ]; then
            echo "::error::File boot.img tidak ditemukan di dalam arsip zip release!"
            exit 1
          fi
          
          echo "-> Membongkar Boot.img dengan AIK..."
          ./unpackimg.sh boot.img
          
          echo "-> Menerapkan Bypass AVB di Fstab Ramdisk..."
          FSTAB_FILE=$(find ramdisk -name "fstab.exynos850" | head -n 1)
          if [ -f "$FSTAB_FILE" ]; then
            echo "Mengeksekusi bypass fstab dengan akses Root..."
            
            # Menggunakan sudo langsung pada sed agar bebas membuat file temporary
            sudo sed -i 's/,avb_keys=[^[:space:]]*//g' "$FSTAB_FILE"
            sudo sed -i 's/avb//g' "$FSTAB_FILE"
            sudo sed -i 's/,,/,/g' "$FSTAB_FILE"
            
            echo "✅ Fstab berhasil dibersihkan dari cengkeraman AVB!"
          else
            echo "⚠️ Peringatan: fstab.exynos850 tidak ditemukan di ramdisk!"
          fi
          
          echo "-> Mencari Kernel Image hasil kompilasi..."
          # Mencari otomatis file Image di seluruh folder workspace
          KERNEL_IMAGE=$(find $GITHUB_WORKSPACE -type f -path "*/arch/arm64/boot/Image" | head -n 1)
          
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::File Image kernel tidak ditemukan! Pastikan proses kompilasi sebelumnya berhasil."
            exit 1
          fi
          
          echo "Ditemukan di: $KERNEL_IMAGE"
          echo "-> Menyuntikkan Kernel Image KSU-Next yang baru..."
          cp "$KERNEL_IMAGE" split_img/boot.img-kernel
          
          echo "-> Membungkus ulang Boot.img..."
          ./repackimg.sh
          
          if [ ! -f "image-new.img" ]; then
            echo "::error::Gagal membungkus ulang boot.img!"
            exit 1
          fi
          
          echo "-> Mengemas menjadi format .tar untuk Odin..."
          mkdir -p $GITHUB_WORKSPACE/odin_output
          cp image-new.img $GITHUB_WORKSPACE/odin_output/boot.img
          cd $GITHUB_WORKSPACE/odin_output
          
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          TAR_NAME="SamsungA04s-KSUNext-Odin-${BUILD_DATE}.tar"
          tar -H ustar -cf "$TAR_NAME" boot.img
          
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV
          echo "✅ Paket Odin .tar berhasil dirakit: $TAR_NAME"

      - name: Upload Odin Tar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-package
          path: odin_output/*.tar
          retention-days: 14
