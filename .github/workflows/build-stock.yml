name: Build KernelSU-Next A14 (Final Weapon)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential curl flex git \
            libelf-dev libssl-dev lz4 python3 zip unzip wget cpio

      - name: Prepare Workspace & Download Assets
        run: |
          mkdir -p $GITHUB_WORKSPACE/workspace
          cd $GITHUB_WORKSPACE/workspace
          
          echo "-> Mengunduh Pure Stock Kernel A14..."
          wget -q https://github.com/dapurandroid/a04s-android14-clean/releases/download/v1.0/stock_kernel.tar.gz
          
          echo "-> Mengekstrak Kernel secara Native Linux..."
          mkdir -p kernel_src
          tar -xzf stock_kernel.tar.gz -C kernel_src
          
          echo "-> Membajak Toolchain Lawas..."
          git clone --depth=1 https://github.com/dapurandroid/android_kernel_a047f_eur forked_repo
          mv forked_repo/toolchain ./toolchain
          rm -rf forked_repo

      - name: Inject KernelSU-Next & Disable Knox
        run: |
          cd $GITHUB_WORKSPACE/workspace
          KERNEL_ROOT=$(find $(pwd)/kernel_src -name "Makefile" -exec grep -l "^VERSION =" {} \; | head -n 1 | xargs dirname)
          cd "$KERNEL_ROOT"
          
          echo "-> Menyuntikkan KernelSU-Next (Latest)..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          echo "-> Melumpuhkan Satpam Samsung (Knox, PROCA, DEFEX)..."
          DEFCONFIG="arch/arm64/configs/exynos850-a04sxx_defconfig"
          
          # Matikan fitur keamanan yang bikin KSU bootloop
          sed -i 's/CONFIG_PROCA=y/# CONFIG_PROCA is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_DEFEX=y/# CONFIG_DEFEX is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_KNOX_KAP=y/# CONFIG_KNOX_KAP is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_SEC_RESTRICT=y/# CONFIG_SEC_RESTRICT is not set/g' $DEFCONFIG
          
          # Aktifkan KSU
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          
          echo "-> Patch Kompatibilitas KSU untuk Kernel Lawas (Fix Error Header)..."
          KSU_DIR="drivers/kernelsu"
          if [ -d "$KSU_DIR" ]; then
            # Fix error pgtable.h dan mount.h
            for f in $(find -L "$KSU_DIR" -type f -name "sucompat.c" 2>/dev/null); do sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g' "$f"; done
            for f in $(find -L "$KSU_DIR" -type f -name "su_mount_ns.c" 2>/dev/null); do sed -i 's|<uapi/linux/mount.h>|<linux/mount.h>|g' "$f"; done
            for f in $(find -L "$KSU_DIR" -type f -name "seccomp_cache.c" 2>/dev/null); do sed -i '1i #ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 1024\n#endif' "$f"; done
            for f in $(find -L "$KSU_DIR" -type f -name "app_profile.c" 2>/dev/null); do sed -i '/filter_count/d' "$f"; done
            
            # Fix makro minmax dan fallthrough
            find -L "$KSU_DIR" -type f -name "*.c" -exec sed -i '1i #ifndef TWA_RESUME\n#define TWA_RESUME true\n#endif\n#ifndef fallthrough\n#define fallthrough do { } while(0)\n#endif' {} \;
            find -L "$KSU_DIR" -type f -name "*.c" -exec sed -i '1i #include <linux/sched/task.h>' {} \;
            find -L "$KSU_DIR" -type f -name "*.c" -exec sed -i 's|<linux/minmax.h>|<linux/kernel.h>|g' {} \;
            find -L "$KSU_DIR" -type f -name "*.h" -exec sed -i 's|<linux/minmax.h>|<linux/kernel.h>|g' {} \;
            
            # Fix Kunci Tasklist
            for f in $(find -L "$KSU_DIR" -type f -name "dispatch.c" 2>/dev/null); do
              sed -i '1i #include <linux/spinlock.h>\n#include <linux/sched/signal.h>\nextern struct task_struct init_task;\nextern rwlock_t tasklist_lock;' "$f"
            done
          fi

      - name: Compile KSU Kernel
        run: |
          cd $GITHUB_WORKSPACE/workspace
          KERNEL_ROOT=$(find $(pwd)/kernel_src -name "Makefile" -exec grep -l "^VERSION =" {} \; | head -n 1 | xargs dirname)
          export TC_DIR="$GITHUB_WORKSPACE/workspace/toolchain"
          export BUILD_CROSS_COMPILE="${TC_DIR}/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          export BUILD_CC="${TC_DIR}/clang/host/linux-x86/clang-r353983c/bin/clang"
          
          chmod -R +x ${TC_DIR}/clang/host/linux-x86/clang-r353983c/bin/
          chmod -R +x ${TC_DIR}/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/
          
          export PLATFORM_VERSION=12
          export ANDROID_MAJOR_VERSION=s
          
          cd "$KERNEL_ROOT"
          
          echo "-> Konfigurasi Defconfig..."
          make ARCH=arm64 CROSS_COMPILE="$BUILD_CROSS_COMPILE" CC="$BUILD_CC" exynos850-a04sxx_defconfig
          
          echo "-> Membangun Kernel Image (KSU)..."
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE="$BUILD_CROSS_COMPILE" CC="$BUILD_CC" Image
          
          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "::error::Build gagal - kernel Image tidak ditemukan!"
            exit 1
          fi
          
          cp arch/arm64/boot/Image $GITHUB_WORKSPACE/workspace/Image

      - name: Package with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/workspace
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cd AK3
          rm -rf .git .github *.md
          
          cp ../Image ./
          
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Samsung A04s KSU-Next (Stable)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          supported.versions=
          supported.patchlevels=
          '; }
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="SamsungA04s-KSU-NEXT-${BUILD_DATE}.zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '.git*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
