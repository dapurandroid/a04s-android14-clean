name: Build KernelSU-Next A14 (Final Weapon)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential curl flex git \
            libelf-dev libssl-dev lz4 python3 zip unzip wget cpio \
            libncurses5-dev

      - name: Prepare Workspace & Download Assets
        run: |
          mkdir -p $GITHUB_WORKSPACE/workspace
          cd $GITHUB_WORKSPACE/workspace
          
          echo "-> Mengunduh Pure Stock Kernel A14..."
          wget -q https://github.com/dapurandroid/a04s-android14-clean/releases/download/v1.0/stock_kernel.tar.gz
          
          echo "-> Mengekstrak Kernel secara Native Linux..."
          mkdir -p kernel_src
          tar -xzf stock_kernel.tar.gz -C kernel_src
          
          echo "-> Membajak Toolchain Lawas..."
          git clone --depth=1 https://github.com/dapurandroid/android_kernel_a047f_eur forked_repo
          mv forked_repo/toolchain ./toolchain
          rm -rf forked_repo

      - name: Membantai Vermagic & Bypass Keamanan Samsung
        run: |
          cd $GITHUB_WORKSPACE/workspace
          KERNEL_ROOT=$(find $(pwd)/kernel_src -name "Makefile" -exec grep -l "^VERSION =" {} \; | head -n 1 | xargs dirname)
          cd "$KERNEL_ROOT"
          
          echo "-> Mencegah Compiler menambahkan string -dirty pada nama kernel..."
          chmod +w scripts/setlocalversion || true
          
          cat << 'EOF' > scripts/setlocalversion
          #!/bin/sh
          echo ""
          EOF
          chmod +x scripts/setlocalversion
          
          echo "-> Menyamarkan /proc/config.gz (Bypass Userspace Samsung)..."
          DEFCONFIG="arch/arm64/configs/exynos850-a04sxx_defconfig"
          chmod +w $DEFCONFIG || true
          sed -i 's/CONFIG_IKCONFIG=y/# CONFIG_IKCONFIG is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_IKCONFIG_PROC=y/# CONFIG_IKCONFIG_PROC is not set/g' $DEFCONFIG

      - name: Inject KSU-Next & SUSFS v1.5.5 (Manual Def Injection)
        run: |
          cd $GITHUB_WORKSPACE/workspace
          KERNEL_ROOT=$(find $(pwd)/kernel_src -name "Makefile" -exec grep -l "^VERSION =" {} + 2>/dev/null | head -n 1 | xargs dirname)
          cd "$KERNEL_ROOT"
          
          echo "-> 1. MENGAMBIL FONDASI SUSFS..."
          git clone https://gitlab.com/simonpunk/susfs4ksu.git temp_susfs
          cd temp_susfs && git checkout v1.5.5 || git checkout kernel-4.19 || true && cd ..
          
          echo "-> 2. MENYALIN HEADERS & SOURCE..."
          mkdir -p include/linux
          cp -rf temp_susfs/kernel_patches/include/* include/ || true
          cp -rf temp_susfs/kernel_patches/fs/* fs/ || true
          
          echo "-> 2.1 MEMBUAT SUSFS_DEF.H MANUAL (PENGUNCI ERROR KSTAT)..."
          # Membuat file susfs_def.h secara eksplisit agar INODE_STATE_SUS_KSTAT dikenali compiler
          cat << 'EOF' > include/linux/susfs_def.h
          #ifndef _LINUX_SUSFS_DEF_H
          #define _LINUX_SUSFS_DEF_H

          #define SUSFS_VERSION "1.5.5"
          #define INODE_STATE_SUS_KSTAT (1 << 28)

          #ifndef CL_COPY_MNT_NS
          #define CL_COPY_MNT_NS (1<<23)
          #endif
          #ifndef CL_ZYGOTE_COPY_MNT_NS
          #define CL_ZYGOTE_COPY_MNT_NS (1<<24)
          #endif

          #endif /* _LINUX_SUSFS_DEF_H */
          EOF

          # Amankan visibilitas struct kstat di susfs.h
          sed -i '1i #include <linux/susfs_def.h>\nstruct kstat;' include/linux/susfs.h
          
          echo "-> 3. MENERAPKAN PATCH INTI SUSFS..."
          cp fs/open.c fs/open.c.bak || true
          chmod -R +w fs/ include/ || true
          patch -p1 < temp_susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          mv fs/open.c.bak fs/open.c || true
          
          echo "-> 4. SUNTIKAN BEDAH PYTHON UNTUK REJECT SAMSUNG..."
          cat << 'EOF' > fix_rejects.py
          import os

          def fix_file(filepath, add_ida=False):
              if not os.path.exists(filepath): return
              with open(filepath, 'r') as f: lines = f.readlines()
              content = "".join(lines)
              
              if "linux/susfs.h" in content: return
              
              last_inc = -1
              for i, line in enumerate(lines):
                  if line.startswith("#include"): last_inc = i
              
              if last_inc != -1:
                  code = "#include <linux/susfs.h>\n"
                  if add_ida and "DEFINE_IDA(susfs_mnt_id_ida)" not in content:
                      code += "DEFINE_IDA(susfs_mnt_id_ida);\nDEFINE_IDA(susfs_mnt_group_ida);\n"
                  
                  lines.insert(last_inc + 1, code)
                  with open(filepath, 'w') as f: f.writelines(lines)

          fix_file('fs/proc/task_mmu.c')
          fix_file('fs/notify/fdinfo.c')
          fix_file('fs/namespace.c', add_ida=True)
          EOF
          python3 fix_rejects.py
          
          echo "-> 5. MENAMBAL SCHED.H (TASK STRUCT)..."
          if ! grep -q "susfs_task_state" include/linux/sched.h; then
              awk '/^struct task_struct \{/ { print; print "\tunsigned long susfs_task_state;"; print "\tint susfs_last_fake_mnt_id;"; next }1' include/linux/sched.h > tmp_sched && mv tmp_sched include/linux/sched.h
          fi
          
          if ! grep -q "CONFIG_KSU_SUSFS" fs/Makefile; then
              echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
              echo "obj-\$(CONFIG_KSU_SUSFS) += susfs_su.o" >> fs/Makefile
          fi
          
          rm -rf temp_susfs fix_rejects.py
          
          echo "-> 6. MENGUNDUH & MEMASANG KERNELSU-NEXT (ce0ff73)..."
          curl -L "https://github.com/KernelSU-Next/KernelSU-Next/archive/ce0ff7395188490934fb1b67446b6a351f22a2b4.tar.gz" -o ksu.tar.gz
          tar -xzf ksu.tar.gz -C . --one-top-level=temp_ksu --strip-components=1
          mkdir -p drivers/kernelsu
          cp -r temp_ksu/kernel/* drivers/kernelsu/
          rm -rf temp_ksu ksu.tar.gz
          
          echo "obj-y += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'ccflags-y += -DKSU_VERSION=11998' >> drivers/kernelsu/Makefile
          
          echo "-> 7. MENERAPKAN MINIMAL SCOPED MANUAL VFS HOOKS..."
          if grep -q "do_execveat_common" fs/exec.c; then
              sed -i '/static int do_execveat_common(/i \extern int ksu_handle_execve(int fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);' fs/exec.c
          fi
          if grep -q "vfs_read(struct file" fs/read_write.c; then
              sed -i '/ssize_t vfs_read(struct file/i \extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos_ptr);' fs/read_write.c
          fi
          if grep -q "vfs_getattr_nosec" fs/stat.c; then
              sed -i '/int vfs_getattr_nosec(/i \extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);' fs/stat.c
          fi
          
          echo "-> 8. HOTFIX BUG KSU-NEXT..."
          sed -i 's/if (!ksu_devpts_hook)/if (0)/g' drivers/kernelsu/sucompat.c || true
          sed -i 's/ksu_devpts_hook = true;/ /g' drivers/kernelsu/sucompat.c || true
          sed -i 's/ksu_devpts_hook = false;/ /g' drivers/kernelsu/sucompat.c || true
          sed -i 's/enable_kprobe/ \/\/ enable_kprobe/g' drivers/kernelsu/sucompat.c || true
          sed -i 's/disable_kprobe/ \/\/ disable_kprobe/g' drivers/kernelsu/sucompat.c || true
          
          echo "-> 9. MELUMPUHKAN SATPAM KEAMANAN SAMSUNG..."
          DEFCONFIG="arch/arm64/configs/exynos850-a04sxx_defconfig"
          sed -i 's/CONFIG_PROCA=y/# CONFIG_PROCA is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_DEFEX=y/# CONFIG_DEFEX is not set/g' $EY_DEFCONFIG 2>/dev/null || true
          sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_KNOX_KAP=y/# CONFIG_KNOX_KAP is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_SEC_RESTRICT=y/# CONFIG_SEC_RESTRICT is not set/g' $DEFCONFIG
          sed -i 's/CONFIG_FIVE=y/# CONFIG_FIVE is not set/g' $DEFCONFIG
          
          FIVE_PORTING="security/samsung/five/five_porting.h"
          [ -f "$FIVE_PORTING" ] && sed -i 's|"drivers/block/loop.h"|"../../../drivers/block/loop.h"|g' "$FIVE_PORTING" || true
          
          echo "-> 10. MENGATUR KCONFIG (VFS HOOKS MODE)..."
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_WITH_KPROBES=n" >> $DEFCONFIG

      - name: Compile Kernel (Android 12 Target)
        run: |
          cd $GITHUB_WORKSPACE/workspace/kernel_src
          
          # Deklarasi Variabel Android (Mutlak mengikuti README Samsung)
          export PLATFORM_VERSION=12
          export ANDROID_MAJOR_VERSION=s
          
          # Buat version.config KOSONG agar tidak merusak nama kernel asli
          echo -e "CONFIG_LOCALVERSION_AUTO=n\nCONFIG_LOCALVERSION=\"\"\n" > "arch/arm64/configs/version.config"
          
          # Eksekusi Kompilasi
          export COMPILER_ARGS="-C $(pwd) O=$(pwd)/out -j$(nproc) ARCH=arm64 CROSS_COMPILE=${GITHUB_WORKSPACE}/workspace/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android- CC=${GITHUB_WORKSPACE}/workspace/toolchain/clang/host/linux-x86/clang-r353983c/bin/clang"
          
          echo "-> Memulai Kompilasi Inti..."
          make $COMPILER_ARGS exynos850-a04sxx_defconfig version.config
          make $COMPILER_ARGS

      - name: Setup AIK-Linux & Package Odin Tar
        run: |
          cd $GITHUB_WORKSPACE
          
          echo "-> Membersihkan area kerja..."
          rm -rf AIK aik.tar.gz stock_boot.zip
          
          echo "-> Mengunduh AIK-Linux dari Release Internal..."
          wget -q https://github.com/dapurandroid/a04s-android14-clean/releases/download/v1.0-boot/AIK-Linux-v3.8-ALL.tar.gz -O aik.tar.gz
          
          echo "-> Mengekstrak AIK-Linux..."
          mkdir AIK
          tar -xzf aik.tar.gz -C AIK --strip-components=1
          cd AIK
          
          echo "-> Mengunduh Stock Boot.img dari Release Internal..."
          wget -q https://github.com/dapurandroid/a04s-android14-clean/releases/download/v1.0-boot/stock_boot.zip -O stock_boot.zip
          unzip -q stock_boot.zip
          
          echo "-> Membongkar Boot.img dengan AIK..."
          ./unpackimg.sh boot.img
          
          echo "-> Mengosongkan OS Version & Patch Level (Bypass Rollback Protection)..."
          echo -n "" > split_img/boot.img-os_version
          echo -n "" > split_img/boot.img-os_patch_level
          
          echo "-> Menerapkan Bypass AVB & VBMETA di Fstab Ramdisk..."
          FSTAB_FILE=$(find ramdisk -name "fstab.exynos850" | head -n 1)
          if [ -f "$FSTAB_FILE" ]; then
            sudo sed -i 's/,avb_keys=[^[:space:]]*//g' "$FSTAB_FILE"
            sudo sed -i 's/,avb//g' "$FSTAB_FILE"
            sudo sed -i 's/avb//g' "$FSTAB_FILE"
            sudo sed -i 's/,vbmeta//g' "$FSTAB_FILE"
            sudo sed -i 's/vbmeta//g' "$FSTAB_FILE"
            sudo sed -i 's/,,/,/g' "$FSTAB_FILE"
          fi
          
          echo "-> Mencari Kernel Image hasil kompilasi..."
          KERNEL_IMAGE=$(find $GITHUB_WORKSPACE -type f -path "*/arch/arm64/boot/Image" | head -n 1)
          
          echo "-> Menyuntikkan Kernel Image KSU-Next yang baru..."
          cp "$KERNEL_IMAGE" split_img/boot.img-kernel
          
          echo "-> Membuat direktori ramdisk wajib Android..."
          mkdir -p ramdisk/{debug_ramdisk,dev,metadata,mnt,proc,second_stage_resources,sys}
          
          echo "-> Membungkus ulang Boot.img..."
          ./repackimg.sh --nosudo
          
          echo "-> Mengemas menjadi format .tar untuk Odin..."
          mkdir -p $GITHUB_WORKSPACE/odin_output
          cp image-new.img $GITHUB_WORKSPACE/odin_output/boot.img
          cd $GITHUB_WORKSPACE/odin_output
          
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          TAR_NAME="SamsungA04s-KSUNext-Odin-${BUILD_DATE}.tar"
          tar -H ustar -cf "$TAR_NAME" boot.img
          
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Odin Tar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-package
          path: odin_output/*.tar
          retention-days: 14
